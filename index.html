
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>불꽃놀이</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050817;
        font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
        touch-action: manipulation;
    }

    body {
        position: relative;
        background:
            radial-gradient(ellipse at 50% 100%, #17234a 0%, #090f29 45%, #02040d 100%);
    }

    /* 별이 빛나는 밤하늘 */
    .stars {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
            radial-gradient(2px 2px at 10% 20%, white 50%, transparent 100%),
            radial-gradient(2px 2px at 30% 70%, white 50%, transparent 100%),
            radial-gradient(2px 2px at 70% 15%, white 50%, transparent 100%),
            radial-gradient(2px 2px at 85% 45%, white 50%, transparent 100%),
            radial-gradient(2px 2px at 50% 35%, white 50%, transparent 100%),
            radial-gradient(1px 1px at 20% 50%, white 50%, transparent 100%),
            radial-gradient(1px 1px at 90% 80%, white 50%, transparent 100%),
            radial-gradient(2px 2px at 60% 85%, white 50%, transparent 100%);
        background-size: 300px 300px;
        opacity: 0.8;
    }

    /* 제목 */
    .header {
        position: absolute;
        top: 8%;
        left: 0;
        width: 100%;
        text-align: center;
        z-index: 2;
        pointer-events: none;
    }

    h1 {
        margin: 0;
        color: #fff;
        font-size: clamp(38px, 8vw, 65px);
        font-weight: 900;
        letter-spacing: 8px;
        text-shadow:
            0 0 10px #ff8cdd,
            0 0 25px #ff4db8,
            0 0 45px #9d4dff;
    }

    .subtitle {
        color: #d9ddff;
        font-size: clamp(15px, 3.5vw, 21px);
        margin-top: 18px;
        letter-spacing: 2px;
        text-shadow: 0 0 10px #728dff;
    }

    /* 불꽃 캔버스 */
    canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
        cursor: crosshair;
        touch-action: none;
    }

    /* 하단 안내 */
    .guide {
        position: absolute;
        bottom: 8%;
        left: 0;
        width: 100%;
        text-align: center;
        z-index: 2;
        color: white;
        font-size: clamp(17px, 4vw, 24px);
        font-weight: bold;
        pointer-events: none;
        text-shadow: 0 0 12px #7799ff;
        animation: blink 2s infinite;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
    }

</style>
</head>

<body>

<div class="stars"></div>

<div class="header">
    <h1>🎆 불꽃놀이 🎆</h1>
    <div class="subtitle">아름다운 밤하늘에 행운을 쏘아 올려요!</div>
</div>

<canvas id="fireworks"></canvas>

<div class="guide">
    ✨ 화면 아무 곳이나 눌러 보세요! ✨
</div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let width;
let height;

let particles = [];
let fireworks = [];

const colors = [
    "#ff3b5c",
    "#ffcc33",
    "#35e6ff",
    "#b76aff",
    "#54ff91",
    "#ff75d8",
    "#ffffff",
    "#ff8c42"
];

// 화면 크기 설정
function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// 불꽃 생성
function createFirework(x, y) {
    const color = colors[Math.floor(Math.random() * colors.length)];

    const count = 90 + Math.floor(Math.random() * 50);

    // 여러 방향으로 퍼지는 불꽃
    for (let i = 0; i < count; i++) {
        const angle = Math.PI * 2 * Math.random();

        const speed = 1.5 + Math.random() * 6;

        const particle = {
            x: x,
            y: y,

            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,

            color: Math.random() < 0.25
                ? colors[Math.floor(Math.random() * colors.length)]
                : color,

            size: 1.5 + Math.random() * 2.5,

            life: 1,
            decay: 0.008 + Math.random() * 0.012,

            gravity: 0.045 + Math.random() * 0.035,

            sparkle: Math.random() > 0.7
        };

        particles.push(particle);
    }

    // 중심부의 밝은 섬광
    fireworks.push({
        x: x,
        y: y,
        radius: 0,
        alpha: 1
    });
}

// 불꽃 그리기
function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.985;
        p.vy *= 0.985;

        p.vy += p.gravity;

        p.life -= p.decay;

        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }

        ctx.globalAlpha = p.life;

        // 불꽃 빛 효과
        ctx.shadowBlur = p.sparkle ? 18 : 10;
        ctx.shadowColor = p.color;

        ctx.fillStyle = p.color;

        const size = p.sparkle
            ? p.size * (0.7 + Math.random() * 0.8)
            : p.size;

        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
}

// 중심 섬광 효과
function drawFlashes() {
    for (let i = fireworks.length - 1; i >= 0; i--) {
        const f = fireworks[i];

        f.radius += 5;
        f.alpha -= 0.08;

        if (f.alpha <= 0) {
            fireworks.splice(i, 1);
            continue;
        }

        ctx.beginPath();
        ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);

        ctx.strokeStyle = `rgba(255,255,255,${f.alpha})`;
        ctx.lineWidth = 3;
        ctx.shadowBlur = 25;
        ctx.shadowColor = "#ffffff";
        ctx.stroke();

        ctx.shadowBlur = 0;
    }
}

// 애니메이션
function animate() {
    // 잔상이 남도록 어두운 배경을 살짝 덮기
    ctx.fillStyle = "rgba(3, 5, 18, 0.18)";
    ctx.fillRect(0, 0, width, height);

    drawFlashes();
    drawParticles();

    requestAnimationFrame(animate);
}

animate();

// 마우스 클릭 및 터치
canvas.addEventListener("pointerdown", function(event) {
    const rect = canvas.getBoundingClientRect();

    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    createFirework(x, y);
});

// 화면을 처음 열었을 때 축포
setTimeout(() => {
    createFirework(width * 0.5, height * 0.45);
}, 500);

setTimeout(() => {
    createFirework(width * 0.3, height * 0.4);
}, 1000);

setTimeout(() => {
    createFirework(width * 0.7, height * 0.4);
}, 1500);

</script>

</body>
</html>
